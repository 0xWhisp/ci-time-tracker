[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-time-tracker"
version = "0.3.0"
description = "Find where CI time and money go: cost, flaky steps and regressions from GitHub Actions, and a PR comment action"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "ci-time-tracker contributors"}
]
keywords = ["ci", "cd", "github-actions", "flaky-tests", "ci-cost", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.17",
]

[project.scripts]
ci-time-tracker = "ci_time_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/0xWhisp/ci-time-tracker"
Repository = "https://github.com/0xWhisp/ci-time-tracker"

[tool.setuptools.packages.find]
where = ["."]
include = ["ci_time_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["ci_time_tracker"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Errors and likely bugs, plus import order and modern syntax. Pinned rather
# than left to ruff's defaults, so a ruff upgrade cannot change what CI
# enforces.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
