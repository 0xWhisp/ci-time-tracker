name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is tested because output encoding differs there
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov=ci_time_tracker --cov-report=term-missing

  report:
    # The tool reports on its own CI: a live demo of the Markdown summary and
    # an end-to-end check against the real GitHub API.
    name: CI time report
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Informational only: a GitHub API hiccup must not fail the build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install .

      - name: Report on this repository's CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ci-time-tracker --github "${{ github.repository }}" --workflow ci.yml
          --last 50 --group-matrix --format markdown >> "$GITHUB_STEP_SUMMARY"
