name: Release

# Publishes to PyPI when a version tag (e.g. v0.2.0) is pushed. Uses PyPI
# trusted publishing, so no API token is stored in the repository; the
# publisher must be configured once on PyPI (see README, "Releasing").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          python - <<'PY'
          import os, re, tomllib
          import ci_time_tracker

          tag = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          if tag != f"v{version}" or ci_time_tracker.__version__ != version:
              raise SystemExit(
                  f"::error::Tag {tag}, pyproject version {version} and "
                  f"__version__ {ci_time_tracker.__version__} must agree"
              )
          PY

      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
