name: CI Time Tracker
description: Comment on pull requests with how they change CI time and cost, and flag failures in steps known to be flaky.
author: 0xWhisp
branding:
  icon: clock
  color: blue

inputs:
  github-token:
    description: Token to read Actions data and comment on the pull request (needs actions read, pull-requests write).
    default: ${{ github.token }}
  run-id:
    description: Workflow run to report on. Defaults to the run that triggered a workflow_run event.
    default: ${{ github.event.workflow_run.id }}
  baseline-branch:
    description: Branch to compare the run with. Defaults to the repository's default branch.
    default: ""
  baseline-runs:
    description: Number of recent baseline runs to compare with.
    default: "20"
  group-matrix:
    description: Merge the legs of matrix jobs into one step.
    default: "true"
  regression-threshold:
    description: Percentage a step must change by (and at least 10 seconds) to be listed.
    default: "25"
  comment:
    description: Post the comparison as a pull request comment, updating the previous one.
    default: "true"
  fail-on:
    description: Fail the job on these findings, comma-separated (regression, flaky). Empty never fails.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install ci-time-tracker
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    # Inputs reach the script through the environment, never interpolated
    # into it, so no input value can inject shell code
    - name: Report CI time impact
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ inputs.run-id }}
        BASELINE_BRANCH: ${{ inputs.baseline-branch }}
        BASELINE_RUNS: ${{ inputs.baseline-runs }}
        GROUP_MATRIX: ${{ inputs.group-matrix }}
        THRESHOLD: ${{ inputs.regression-threshold }}
        COMMENT: ${{ inputs.comment }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -o pipefail

        if [ -z "$RUN_ID" ]; then
          echo "::error::No run to report on: set run-id, or trigger this from a workflow_run event."
          exit 1
        fi

        args=(--github "$REPO" --run-id "$RUN_ID" --baseline-runs "$BASELINE_RUNS"
              --regression-threshold "$THRESHOLD" --format markdown)
        if [ -n "$BASELINE_BRANCH" ]; then args+=(--baseline-branch "$BASELINE_BRANCH"); fi
        if [ "$GROUP_MATRIX" = "true" ]; then args+=(--group-matrix); fi
        if [ "$COMMENT" = "true" ]; then args+=(--comment); fi
        if [ -n "$FAIL_ON" ]; then args+=(--fail-on "$FAIL_ON"); fi

        ci-time-tracker "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
